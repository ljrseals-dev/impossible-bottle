name: Recursively extract nested pipeline archives

on:
  push:
    branches:
      - extract/impossible-bottle-pipeline
    paths:
      - .github/workflows/extract-recursive.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract/impossible-bottle-pipeline
          fetch-depth: 0

      - name: Extract nested tar.gz files safely
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import tarfile

          root = pathlib.Path("pipeline")
          extracted_total = 0
          for depth in range(1, 7):
              archives = sorted(p for p in root.rglob("*.tar.gz") if p.is_file())
              if not archives:
                  break
              for archive in archives:
                  destination = archive.parent / f"extracted-{depth}"
                  if destination.exists() and any(destination.iterdir()):
                      raise SystemExit(f"Refusing to overwrite {destination}")
                  destination.mkdir(parents=True, exist_ok=True)
                  seen = set()
                  total_size = 0
                  try:
                      with tarfile.open(archive, "r:gz") as tf:
                          members = tf.getmembers()
                          if len(members) > 100000:
                              raise ValueError("too many entries")
                          for member in members:
                              name = member.name
                              normalized = name
                              while normalized.startswith("./"):
                                  normalized = normalized[2:]
                              p = pathlib.PurePosixPath(normalized)
                              if (not normalized or normalized.startswith("/")
                                  or "\\" in normalized
                                  or any(part in ("", ".", "..") for part in p.parts)):
                                  raise ValueError(f"unsafe path: {name!r}")
                              if normalized in seen:
                                  raise ValueError(f"duplicate path: {name!r}")
                              seen.add(normalized)
                              if not (member.isdir() or member.isfile()):
                                  raise ValueError(f"link/special member rejected: {name!r}")
                              if member.size < 0 or member.size > 250 * 1024 * 1024:
                                  raise ValueError(f"member too large: {name!r}")
                              total_size += member.size
                              if total_size > 1024 * 1024 * 1024:
                                  raise ValueError("expanded archive too large")
                          tf.extractall(destination, members=members, filter="data")
                  except Exception as exc:
                      print(f"FAILED_ARCHIVE={archive}")
                      print(f"DESTINATION={destination}")
                      print(f"ERROR={type(exc).__name__}: {exc}")
                      raise
                  archive.unlink()
                  extracted_total += len(members)
                  print(f"EXTRACTED {archive} -> {destination} ({len(members)} entries)")
          remaining = sorted(str(p) for p in root.rglob("*.tar.gz") if p.is_file())
          print(f"TOTAL_ENTRIES={extracted_total}")
          print("REMAINING_ARCHIVES=" + repr(remaining))
          if remaining:
              raise SystemExit("Nested archive depth limit reached")
          PY

      - name: Commit recursive extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline
          git commit -m "Recursively extract nested pipeline archives"
          git push origin HEAD:extract/impossible-bottle-pipeline
