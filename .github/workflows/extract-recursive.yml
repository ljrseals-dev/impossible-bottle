name: Recursively extract nested pipeline archives

on:
  push:
    branches:
      - extract/impossible-bottle-pipeline
    paths:
      - .github/workflows/extract-recursive.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract/impossible-bottle-pipeline
          fetch-depth: 0
      - name: Extract archives safely
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, tarfile
          root = pathlib.Path("pipeline")
          total = 0
          for depth in range(1, 7):
              archives = sorted(p for p in root.rglob("*.tar.gz") if p.is_file())
              if not archives:
                  break
              for archive in archives:
                  destination = archive.parent / f"extracted-{depth}"
                  suffix = 1
                  while destination.exists() and any(destination.iterdir()):
                      suffix += 1
                      destination = archive.parent / f"extracted-{depth}-{suffix}"
                  destination.mkdir(parents=True, exist_ok=True)
                  seen, expanded = set(), 0
                  with tarfile.open(archive, "r:gz") as tf:
                      members = tf.getmembers()
                      if len(members) > 100000:
                          raise SystemExit(f"too many entries: {archive}")
                      for m in members:
                          name = m.name
                          normalized = name
                          while normalized.startswith("./"):
                              normalized = normalized[2:]
                          p = pathlib.PurePosixPath(normalized)
                          if not normalized or normalized.startswith("/") or "\\" in normalized or any(x in ("", ".", "..") for x in p.parts):
                              raise SystemExit(f"unsafe path {name!r} in {archive}")
                          if normalized in seen:
                              raise SystemExit(f"duplicate path {name!r} in {archive}")
                          seen.add(normalized)
                          if not (m.isdir() or m.isfile()):
                              raise SystemExit(f"link/special member rejected: {name!r}")
                          if m.size < 0 or m.size > 250 * 1024 * 1024:
                              raise SystemExit(f"oversized member: {name!r}")
                          expanded += m.size
                          if expanded > 1024 * 1024 * 1024:
                              raise SystemExit(f"expanded archive too large: {archive}")
                      tf.extractall(destination, members=members, filter="data")
                  archive.unlink()
                  total += len(members)
                  print(f"EXTRACTED {archive} -> {destination} ({len(members)} entries)")
          remaining = sorted(str(p) for p in root.rglob("*.tar.gz") if p.is_file())
          print(f"EXTRACTED_ENTRIES={total}")
          print(f"REMAINING_ARCHIVES={remaining}")
          if remaining:
              raise SystemExit("Archive nesting exceeds six extraction passes")
          PY
      - name: Commit extracted contents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline
          git commit -m "Extract recursively nested pipeline archives"
          git push origin HEAD:extract/impossible-bottle-pipeline
