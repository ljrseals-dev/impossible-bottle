name: Extract fifth-level embedded archive
on:
  push:
    branches: [extract/impossible-bottle-pipeline]
    paths: [.github/workflows/extract-level-5.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract/impossible-bottle-pipeline
          fetch-depth: 0
      - name: Extract embedded archive
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, tarfile
          archives=sorted(p for p in pathlib.Path("pipeline").rglob("*.tar.gz") if p.is_file())
          if len(archives)!=1: raise SystemExit(f"Expected one archive: {archives}")
          archive=archives[0]; dest=archive.parent/"nested"
          if dest.exists(): raise SystemExit(f"Destination exists: {dest}")
          dest.mkdir(parents=True)
          with tarfile.open(archive,"r:gz") as tf:
              members=tf.getmembers()
              if len(members)>100000: raise SystemExit("Too many entries")
              seen=set(); total=0
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  if not m.name or m.name.startswith("/") or "\\" in m.name or any(x in ("",".","..") for x in p.parts): raise SystemExit(f"Unsafe path: {m.name!r}")
                  if m.name in seen: raise SystemExit(f"Duplicate: {m.name!r}")
                  seen.add(m.name)
                  if not (m.isdir() or m.isfile()): raise SystemExit(f"Unsupported member: {m.name!r}")
                  if m.size<0 or m.size>250*1024*1024: raise SystemExit(f"Oversized: {m.name!r}")
                  total+=m.size
                  if total>1024*1024*1024: raise SystemExit("Expanded archive too large")
              tf.extractall(dest,members=members,filter="data")
          archive.unlink()
          print(f"EXTRACTED {len(members)} entries to {dest}")
          PY
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline
          git commit -m "Extract fifth-level embedded archive"
          git push origin HEAD:extract/impossible-bottle-pipeline
