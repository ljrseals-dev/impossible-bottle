name: Extract all nested pipeline archives

on:
  push:
    branches:
      - extract/impossible-bottle-pipeline
    paths:
      - .github/workflows/extract-recursive.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract/impossible-bottle-pipeline
          fetch-depth: 0
      - name: Recursively extract validated tar.gz archives
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, tarfile
          root = pathlib.Path("pipeline")
          count = 0
          for depth in range(1, 7):
              archives = sorted(p for p in root.rglob("*.tar.gz") if p.is_file())
              if not archives:
                  break
              for archive in archives:
                  destination = archive.parent / f"nested-{depth}"
                  if destination.exists():
                      raise SystemExit(f"Destination already exists: {destination}")
                  destination.mkdir(parents=True)
                  seen, expanded = set(), 0
                  with tarfile.open(archive, "r:gz") as tf:
                      members = tf.getmembers()
                      if len(members) > 100000:
                          raise SystemExit(f"Too many entries: {archive}")
                      for m in members:
                          name = m.name
                          p = pathlib.PurePosixPath(name)
                          if not name or name.startswith("/") or "\\" in name or any(x in ("", ".", "..") for x in p.parts):
                              raise SystemExit(f"Unsafe archive path: {name!r}")
                          if name in seen:
                              raise SystemExit(f"Duplicate archive path: {name!r}")
                          seen.add(name)
                          if not (m.isdir() or m.isfile()):
                              raise SystemExit(f"Link/special member rejected: {name!r}")
                          if m.size < 0 or m.size > 250 * 1024 * 1024:
                              raise SystemExit(f"Member too large: {name!r}")
                          expanded += m.size
                          if expanded > 1024 * 1024 * 1024:
                              raise SystemExit(f"Archive expansion too large: {archive}")
                      tf.extractall(destination, members=members, filter="data")
                  archive.unlink()
                  count += len(members)
                  print(f"EXTRACTED {archive} -> {destination} ({len(members)} entries)")
          remaining = sorted(str(p) for p in root.rglob("*.tar.gz") if p.is_file())
          print(f"EXTRACTED_ENTRIES={count}")
          print(f"REMAINING_ARCHIVES={remaining}")
          if remaining:
              raise SystemExit("Stopped at recursion depth limit; archive remains")
          PY
      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline
          git commit -m "Extract nested pipeline archive contents"
          git push origin HEAD:extract/impossible-bottle-pipeline
