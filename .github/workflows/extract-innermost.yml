name: Extract innermost pipeline archive
on:
  push:
    branches: [extract/impossible-bottle-pipeline]
    paths: [.github/workflows/extract-innermost.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract/impossible-bottle-pipeline
          fetch-depth: 0
      - name: Extract innermost archive
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, tarfile
          archive=pathlib.Path("pipeline/artifacts/nested/artifacts/impossible-bottle-pipeline.tar.gz")
          dest=archive.parent/"nested"
          if not archive.is_file(): raise SystemExit(f"Missing {archive}")
          if dest.exists(): raise SystemExit(f"Destination exists: {dest}")
          dest.mkdir(parents=True)
          with tarfile.open(archive,"r:gz") as tf:
              members=tf.getmembers()
              if len(members)>100000: raise SystemExit("Too many entries")
              seen=set(); expanded=0
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  if not m.name or m.name.startswith("/") or "\\" in m.name or any(x in ("",".","..") for x in p.parts):
                      raise SystemExit(f"Unsafe path: {m.name!r}")
                  if m.name in seen: raise SystemExit(f"Duplicate: {m.name!r}")
                  seen.add(m.name)
                  if not (m.isdir() or m.isfile()): raise SystemExit(f"Unsupported member: {m.name!r}")
                  if m.size<0 or m.size>250*1024*1024: raise SystemExit(f"Oversized: {m.name!r}")
                  expanded+=m.size
                  if expanded>1024*1024*1024: raise SystemExit("Expanded archive too large")
              tf.extractall(dest,members=members,filter="data")
          archive.unlink()
          print(f"EXTRACTED {len(members)} entries into {dest}")
          PY
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline/artifacts/nested
          git commit -m "Extract innermost pipeline archive"
          git push origin HEAD:extract/impossible-bottle-pipeline
