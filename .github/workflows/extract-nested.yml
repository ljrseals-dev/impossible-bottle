name: Extract nested pipeline archive

on:
  push:
    branches:
      - extract/impossible-bottle-pipeline
    paths:
      - .github/workflows/extract-nested.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract/impossible-bottle-pipeline
          fetch-depth: 0

      - name: Validate and extract nested archive
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path("pipeline/artifacts/impossible-bottle-pipeline.tar.gz")
          destination = pathlib.Path("pipeline/artifacts/nested")
          if not archive.is_file():
              raise SystemExit("Nested archive is missing")
          if destination.exists() and any(destination.iterdir()):
              raise SystemExit("Destination is not empty; refusing to overwrite existing files")
          destination.mkdir(parents=True, exist_ok=True)

          seen = set()
          total_size = 0
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              if len(members) > 100000:
                  raise SystemExit("Archive rejected: too many members")
              for member in members:
                  name = member.name
                  p = pathlib.PurePosixPath(name)
                  if (not name or name.startswith("/") or "\\" in name
                      or any(part in ("", ".", "..") for part in p.parts)):
                      raise SystemExit(f"Unsafe archive path: {name!r}")
                  if name in seen:
                      raise SystemExit(f"Duplicate archive path: {name!r}")
                  seen.add(name)
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f"Unsupported link or special member: {name!r}")
                  if member.size < 0 or member.size > 250 * 1024 * 1024:
                      raise SystemExit(f"Member exceeds size limit: {name!r}")
                  total_size += member.size
                  if total_size > 1024 * 1024 * 1024:
                      raise SystemExit("Archive exceeds 1 GiB expanded-size limit")
              tf.extractall(destination, members=members, filter="data")
          archive.unlink()
          print(f"Extracted {len(members)} validated entries into {destination}/")
          for path in sorted(destination.rglob("*")):
              if path.is_file():
                  print(f"FILE {path} {path.stat().st_size}")
          PY

      - name: Commit extracted contents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline/artifacts
          git add -A .github/workflows/extract-nested.yml
          git commit -m "Extract nested pipeline archive"
          git push origin HEAD:extract/impossible-bottle-pipeline
